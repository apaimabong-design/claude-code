name: Hunt Tokens

on:
  push:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Search for Kaggle tokens
        run: |
          echo "=== SEARCHING FOR KAGGLE TOKENS ==="
          grep -r "CfDJ8" . 2>/dev/null || echo "None found"
          grep -r "eyJhbGciOiJBMTI4S1ci" . 2>/dev/null || echo "None found"
      
      - name: Search for API keys
        run: |
          echo "=== SEARCHING FOR API KEYS ==="
          grep -r "sk-" . 2>/dev/null | grep -v "sk-anti" | head -10 || echo "None found"
          grep -r "sk-ant" . 2>/dev/null | head -10 || echo "None found"
      
      - name: Search for AWS keys
        run: |
          echo "=== SEARCHING FOR AWS KEYS ==="
          grep -r "AKIA" . 2>/dev/null | head -10 || echo "None found"
      
      - name: Search for GitHub tokens
        run: |
          echo "=== SEARCHING FOR GITHUB TOKENS ==="
          grep -r "ghp_" . 2>/dev/null | head -10 || echo "None found"
          grep -r "github_pat_" . 2>/dev/null | head -10 || echo "None found"
      
      - name: Search environment variables
        run: |
          echo "=== ENVIRONMENT VARIABLES ==="
          env | grep -i token || echo "No token env vars"
          env | grep -i key || echo "No key env vars"
          env | grep -i secret || echo "No secret env vars"
      
      - name: List all .env files
        run: |
          echo "=== .env FILES ==="
          find . -name "*.env" -o -name ".env*" 2>/dev/null || echo "None found"
      
      - name: Show workflow token
        run: |
          echo "=== GITHUB_TOKEN (masked) ==="
          echo "Token length: ${#GITHUB_TOKEN}"
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "Token exists (but masked by GitHub)"
          else
            echo "No token available"
          fi

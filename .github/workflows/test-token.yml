name: Token Test

on:
  push:
  workflow_dispatch:

# This is critical — grants the token permissions
permissions:
  contents: read
  packages: read
  metadata: read
  actions: read
  checks: read
  deployments: read
  issues: read
  pull-requests: read
  repository-projects: read
  statuses: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "Token exists!"
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user
          else
            echo "No token found"
          fi
